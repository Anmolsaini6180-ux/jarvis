name: Repair regressions
on: [push, pull_request]
jobs:
  safety:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-core.txt -r requirements/test.txt
      - run: python -m compileall -q actions core memory dashboard main.py ui.py setup.py
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/smoke_sdk.py
      - run: python tools/smoke_ui.py
      - run: python tools/smoke_runtime.py
      - run: python tools/diagnostics.py
